<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three in a row — Tic Tac Toe</title><link rel="stylesheet" href="tictactoe.css"><script type="module" src="tictactoe.mjs"></script></head><body><main><a href="index.html" class="back">← All projects</a><p class="eyebrow">A game for two</p><h1>Three in a row.</h1><p class="intro">Take a seat. Pick a side. Make your move.</p><form id="players"><div><label for="player-x">Player X</label><input id="player-x" name="player_x" value="Player X" maxlength="40" required></div><div><label for="player-o">Player O</label><input id="player-o" name="player_o" value="Player O" maxlength="40" required></div><button type="submit">Start new game</button></form><section class="game" aria-label="Tic tac toe"><p id="game-status" role="status"></p><div class="board" id="board" role="group" aria-label="Game board"><button type="button" data-cell="0" aria-label="Row 1 column 1, empty"></button><button type="button" data-cell="1" aria-label="Row 1 column 2, empty"></button><button type="button" data-cell="2" aria-label="Row 1 column 3, empty"></button><button type="button" data-cell="3" aria-label="Row 2 column 1, empty"></button><button type="button" data-cell="4" aria-label="Row 2 column 2, empty"></button><button type="button" data-cell="5" aria-label="Row 2 column 3, empty"></button><button type="button" data-cell="6" aria-label="Row 3 column 1, empty"></button><button type="button" data-cell="7" aria-label="Row 3 column 2, empty"></button><button type="button" data-cell="8" aria-label="Row 3 column 3, empty"></button></div><button id="restart" type="button">Play again</button></section><footer>Local two-player game · The Odin Project</footer></main></body></html>
