<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Selectors practice 2</title><style>body{font:1.2em/1.5 sans-serif;margin:2rem}#special{background:yellow}.alert{border:2px solid grey}.alert.stop{background:red}.alert.go{background:green}</style></head><body><div class="container"><h1>This is a heading</h1><p>One <span class="alert">notice</span> and one <span class="alert stop">stop message</span>.</p><h2 id="special">A level 2 heading</h2><p>The following section continues.</p><h2>Another level 2 heading</h2><p><span class="alert go">A go message</span> appears here.</p></div></body></html>
