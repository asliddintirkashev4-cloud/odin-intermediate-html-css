<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author studio</title><link rel="stylesheet" href="style.css"><script src="client.js" defer></script></head><body data-mode="author"><a class="skip" href="#main">Skip to content</a><header><a class="brand" href="index.html">Field notes / a learning journal</a><nav><a href="index.html">Read the blog</a></nav></header><main id="main"><p class="eyebrow">IDEAS FROM THE WORKBENCH</p><h1>Author studio</h1><p id="status" role="status" aria-live="polite"></p><form id="login-form"><label for="email">Author email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>Sign in</button></form><button id="logout" hidden>Sign out</button><form id="post-form" hidden><h2>Write a post</h2><input name="id" type="hidden"><label for="title">Title</label><input id="title" name="title" maxlength="200" required><label for="content">Post content</label><textarea id="content" name="content" maxlength="20000" required></textarea><label class="row"><input class="check" type="checkbox" name="published"> Published</label><div class="actions"><button>Save post</button><button id="new-post" type="button">Start a new post</button></div></form><section aria-label="Posts" id="posts"></section><section aria-label="Selected post" id="detail"></section><details><summary>API connection</summary><form id="api-settings"><label for="api-base">Blog API address</label><input id="api-base" type="url" required><button>Connect</button></form></details></main><footer>Field notes · Built with Express, Prisma and a little curiosity.</footer></body></html>
