<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Selectors practice 3</title><style>body{font:1.2em/1.5 sans-serif;margin:2rem}*{box-sizing:border-box}table{border-collapse:collapse;width:300px}td,th{padding:.2em;text-align:left}a:link{color:orange}a:visited{color:green}a:hover{text-decoration:none}.container>:first-child{font-size:150%}.container>:first-child::first-line{color:red}tr:nth-child(even){background:#333333;color:white}</style></head><body><div class="container"><p>Explore a <a href="https://example.com">new example</a> and consider how the first line changes independently of the rest of the paragraph.</p><p>This second paragraph keeps its regular size and color.</p><table><tbody><tr><th>Fruits</th><th>Vegetables</th></tr><tr><td>Apple</td><td>Potato</td></tr><tr><td>Orange</td><td>Carrot</td></tr><tr><td>Tomato</td><td>Parsnip</td></tr><tr><td>Kiwi</td><td>Onion</td></tr><tr><td>Banana</td><td>Beet</td></tr></tbody></table></div></body></html>
