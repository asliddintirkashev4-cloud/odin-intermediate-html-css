<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnotes — A little room to think</title><link rel="stylesheet" href="todo.css?v=2"><script type="module" src="todo.mjs"></script></head><body><aside><a class="brand" href="todo.html">fieldnotes<span>A little room to think.</span></a><p class="eyebrow">Your projects</p><nav id="project-list" aria-label="Projects"></nav><form id="project-form"><label class="sr-only" for="project-name">New project name</label><input id="project-name" name="project_name" placeholder="New project…" required maxlength="60"><button type="submit" aria-label="Add project">+</button></form><a class="all-projects" href="index.html">← All coursework</a></aside><main><header><div><p class="eyebrow">One thing at a time</p><h1 id="project-title">Inbox</h1><p id="task-count"></p></div><button id="add-task" type="button">+ New task</button></header><div class="list-heading"><p>Your tasks</p><label for="filter" class="sr-only">Show tasks</label><select id="filter"><option value="all">All tasks</option><option value="open">To do</option><option value="done">Completed</option></select></div><div id="tasks"></div><div id="empty"><h2>Make a little space.</h2><p>Capture a task, choose what matters, and take it from there.</p></div><p id="storage-warning" role="status"></p><p id="announcement" role="status" class="sr-only"></p></main><dialog id="task-dialog" aria-labelledby="dialog-title"><form id="task-form"><div class="dialog-heading"><h2 id="dialog-title">A fresh thought.</h2><button id="cancel-task" class="plain" type="button" aria-label="Close task form">×</button></div><label for="task-title">Title *</label><input id="task-title" name="title" required maxlength="200"><label for="task-description">Description</label><textarea id="task-description" name="description" rows="3" maxlength="3000"></textarea><div class="form-grid"><div><label for="task-date">Due date</label><input id="task-date" name="due_date" type="date"></div><div><label for="task-priority">Priority</label><select id="task-priority" name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div></div><label for="task-project">Project</label><select id="task-project" name="project"></select><p id="form-error" role="alert"></p><button type="submit">Save task</button></form></dialog></body></html>
