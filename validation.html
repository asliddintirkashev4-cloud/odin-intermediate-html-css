<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A good start — Form practice</title><link rel="stylesheet" href="library.css"><link rel="stylesheet" href="validation.css"><script type="module" src="validation.mjs"></script></head>
<body><header><a class="brand" href="index.html">f.<span>Form studies</span></a><a href="index.html">All projects ↗</a></header><main class="form-page"><p class="eyebrow">A little attention to detail</p><h1>A good start.</h1><p>Try the form. Your information stays on this page.</p><form id="practice-form" novalidate>
<label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" aria-describedby="email-error"><p class="field-error" id="email-error" aria-live="polite"></p>
<label for="country">Country</label><select id="country" name="country" required aria-describedby="country-error"><option value="">Choose your country</option><option value="UZ">Uzbekistan</option><option value="US">United States</option><option value="CA">Canada</option><option value="GB">United Kingdom</option></select><p class="field-error" id="country-error" aria-live="polite"></p>
<label for="postal">Postal code</label><input id="postal" name="postal" required autocomplete="postal-code" aria-describedby="postal-error"><p class="field-error" id="postal-error" aria-live="polite"></p>
<label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" aria-describedby="password-help password-error"><small id="password-help">At least 8 characters.</small><p class="field-error" id="password-error" aria-live="polite"></p>
<label for="confirmation">Confirm password</label><input id="confirmation" name="confirmation" type="password" required autocomplete="new-password" aria-describedby="confirmation-error"><p class="field-error" id="confirmation-error" aria-live="polite"></p>
<button type="submit">Check my form ↗</button><p id="result" role="status"></p></form></main></body></html>
